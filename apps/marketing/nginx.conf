server {
  listen 80 default_server;
  server_name _;

  # TLS terminates at the Coolify proxy; relative Location headers keep redirects on https.
  absolute_redirect off;

  rewrite ^/portfolio$ /clients permanent;
  rewrite ^/portfolio/(.+)$ /clients/$1 permanent;
  rewrite ^/sow/?$ /legal/sow permanent;

  # Unknown URLs get the prerendered NotFound page with a real 404 status.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Prerendered routes live at <route>/index.html; anything else is a 404.
    try_files $uri $uri/index.html =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
